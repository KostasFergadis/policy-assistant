services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
      POSTGRES_DB: policy
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
